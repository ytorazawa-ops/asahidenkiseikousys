<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;background:#FBFBFB}
body{font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic Medium",Meiryo,sans-serif;-webkit-font-smoothing:antialiased;font-feature-settings:"palt" 1;color:#1A1A1A}
a{color:#1B6FD0;text-decoration:none}
a:hover{color:#E60012}
</style>
</helmet>

<div style="min-height:100vh;background:#FBFBFB;display:flex;flex-direction:column">
  <div style="height:78px;background:#F4F4F4;border-bottom:1px solid #E8E8E8;display:flex;align-items:center;padding:0 34px;flex:none">
    <div style="display:flex;align-items:center;gap:14px">
      <span style="width:22px;height:22px;background:#E60012;border-radius:3px;display:block;flex:none"></span>
      <span style="font-size:20px;font-weight:700;letter-spacing:.02em;flex:none;white-space:nowrap">旭電気製鋼株式会社</span>
      <span style="font-size:18px;font-weight:500;color:#3A3A3A;margin-left:12px;flex:none;white-space:nowrap">問合せ管理システム</span>
    </div>
  </div>
  <div style="flex:1;display:flex;align-items:flex-start;justify-content:center;padding:88px 24px 60px">
    <div style="width:404px;max-width:100%;background:#fff;border:1px solid #E4E4E4;border-radius:10px;padding:40px 36px 34px">
      <div style="text-align:center;margin-bottom:34px">
        <p style="margin:0 0 6px;font-size:19px;font-weight:700;letter-spacing:.03em">ログイン</p>
        <p style="margin:0;font-size:12.5px;color:#8A8A8A">社内ユーザー専用</p>
      </div>
      <p style="margin:0 0 7px;font-size:12.5px;color:#5C5C5C">メールアドレス</p>
      <input type="email" placeholder="taro.yamada@example.co.jp" style="width:100%;height:46px;border:1px solid #DCDCDC;border-radius:6px;background:#fff;margin-bottom:20px;padding:0 14px;font-size:13px;font-family:inherit;color:#1A1A1A;outline:none;box-sizing:border-box" style-focus="border-color:#E60012">
      <p style="margin:0 0 7px;font-size:12.5px;color:#5C5C5C">パスワード</p>
      <input type="password" placeholder="••••••••" style="width:100%;height:46px;border:1px solid #DCDCDC;border-radius:6px;background:#fff;margin-bottom:14px;padding:0 14px;font-size:14px;font-family:inherit;color:#1A1A1A;outline:none;box-sizing:border-box" style-focus="border-color:#E60012">
      <label style="display:flex;align-items:center;gap:9px;margin-bottom:26px;font-size:12.5px;color:#5C5C5C;cursor:pointer">
        <input type="checkbox" style="width:15px;height:15px;accent-color:#E60012;margin:0">ログイン状態を保持する
      </label>
      <a href="sc04-dashboard.dc.html" style="display:block;width:100%;height:48px;line-height:48px;text-align:center;border-radius:6px;background:#E60012;color:#fff;font-size:15px;font-weight:500;letter-spacing:.06em" style-hover="background:#C1000F;color:#fff">ログイン</a>
      <p style="margin:20px 0 0;text-align:center;font-size:12.5px"><a href="sc03-login.dc.html">パスワードをお忘れの方</a></p>
    </div>
  </div>
</div>
</x-dc>

</html>
